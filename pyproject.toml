[project]
name = "imf-reader"
version = "2.0.1"
description = "A package to access imf data"
authors = [{ name = "The ONE Campaign" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.2",
    "requests>=2.32.1",
    "beautifulsoup4>=4.12.3",
    "pyarrow>=14.0",
    "readerkit>=0.1.0",
]

[tool.pytest.ini_options]
markers = [
    "live: hits real external services; skipped unless IMF_READER_LIVE_TESTS=1",
]

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version",
]
branch = "main"
changelog_file = "CHANGELOG.md"
build_command = "pip install uv && uv build"

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-cov>=5.0.0",
    "ruff>=0.15.0",
    "ty>=0.0.59",
    "pre-commit>=4.6.0",
]
docs = [
    "sphinx>=7.3.7",
    "myst-nb>=1.1.0",
    "sphinx-autoapi>=3.0.0",
    "sphinx-rtd-theme>=2.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-include = ["*.ipynb"]

exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    ".pytest_cache",
    "htmlcov",
]

[tool.ruff.lint]

select = [
    "E", "W", "F",      # pycodestyle, pyflakes
    "I",                 # isort
    "N",                 # pep8-naming
    "UP",                # pyupgrade
    "B",                 # bugbear
    "C4",                # comprehensions
    "SIM",               # simplify
    "PL",                # pylint
    "RUF",               # ruff-specific
    "ERA",               # eradicate (commented-out code)
    "PERF",              # perflint
    "ANN",               # flake8-annotations (require type hints on public APIs)
]

ignore = [
    "E501",     # Line length (formatter handles)
    "PLR0913",  # Too many arguments
    "PLR0912",  # Too many branches
    "PLR0914",  # Too many locals
    "PLR0915",  # Too many statements
    "PLR2004",  # Magic values
    "ANN401",   # Allow `Any` in typed signatures
]

fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]

# Tests are exempt from annotations and the pylint-complexity gates. PLC0415: many
# tests import a deprecated shim symbol inside the test body itself (sometimes inside
# a warnings.catch_warnings() block), a deliberate per-test scoping pattern rather than
# a top-level import.
"tests/**/*.py" = ["ANN", "PLR2004", "PLC0415"]
# Notebooks are exempt from annotations and allow REPL-style patterns.
"**/*.ipynb" = ["ANN", "F401", "F811", "E402"]
# Allow global variable usage in the cache-config module (memoised singleton pattern).
"src/imf_reader/cache/config.py" = ["PLW0603"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src/imf_reader", "scripts"]
