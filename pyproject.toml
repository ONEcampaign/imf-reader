[project]
name = "imf-reader"
version = "2.0.1"
description = "A package to access imf data"
authors = [{ name = "The ONE Campaign" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.12"
keywords = [
    "imf",
    "world-economic-outlook",
    "weo",
    "sdr",
    "special-drawing-rights",
    "economic-data",
    "pandas",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=3.0.0",
    "requests>=2.32.1",
    "beautifulsoup4>=4.12.3",
    "pyarrow>=16.0",
    "readerkit>=0.1.0",
]

[project.urls]
homepage = "https://docs.one.org/tools/imf-reader/"
documentation = "https://docs.one.org/tools/imf-reader/"
repository = "https://github.com/ONEcampaign/imf-reader"
issues = "https://github.com/ONEcampaign/imf-reader/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
# Warnings are errors so that a dependency's deprecation shows up as a failing
# build while there is still a release cycle to act on it, rather than as a
# breakage after the upstream removal lands.
filterwarnings = ["error"]
xfail_strict = true
markers = [
    "live: hits real external services; skipped unless IMF_READER_LIVE_TESTS=1",
]

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version",
]
build_command = "pip install uv && uv build"

# `branch` and `changelog_file` used to live directly above. Both moved:
# the release branch to a `branches.<name>` table, and `changelog_file` to
# `changelog.default_templates` (deprecated in v9.11.0). Left at the top level
# they are simply ignored, so the branch restriction and the changelog path
# silently fall back to defaults.
[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "ruff>=0.16.0",
    "ty>=0.0.59",
    "pre-commit>=4.6.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-include = ["*.ipynb"]

exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    ".pytest_cache",
]

[tool.ruff.lint]

select = [
    "E", "W", "F",      # pycodestyle, pyflakes
    "I",                 # isort
    "N",                 # pep8-naming
    "UP",                # pyupgrade
    "B",                 # bugbear
    "C4",                # comprehensions
    "SIM",               # simplify
    "PL",                # pylint
    "RUF",               # ruff-specific
    "ERA",               # eradicate (commented-out code)
    "PERF",              # perflint
    "ANN",               # flake8-annotations (require type hints on public APIs)
    "S",                 # bandit (security — this package parses data off the wire)
    "DTZ",               # flake8-datetimez (no naive datetimes in a data library)
]

ignore = [
    "E501",     # Line length (formatter handles)
    "PLR0913",  # Too many arguments
    "PLR0912",  # Too many branches
    "PLR0914",  # Too many locals
    "PLR0915",  # Too many statements
    "PLR2004",  # Magic values
    "ANN401",   # Allow `Any` in typed signatures
]

fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]

# Tests are exempt from annotations and the pylint-complexity gates. PLC0415: many
# tests import a deprecated shim symbol inside the test body itself (sometimes inside
# a warnings.catch_warnings() block), a deliberate per-test scoping pattern rather than
# a top-level import.
# PLR0917: @patch decorators inject one positional mock per decorator, so a test
# with several patches exceeds the positional-argument cap by construction.
# S101: `assert` is how pytest expresses every assertion.
"tests/**/*.py" = ["ANN", "PLR2004", "PLC0415", "PLR0917", "S101"]
# Notebooks are exempt from annotations and allow REPL-style patterns.
"**/*.ipynb" = ["ANN", "F401", "F811", "E402"]
# Allow global variable usage in the cache-config module (memoised singleton pattern).
"src/imf_reader/cache/config.py" = ["PLW0603"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src/imf_reader", "scripts"]
