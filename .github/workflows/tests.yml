# this workflow runs unit tests and checks code style
# for different versions of python on different operating systems

name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.py }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest, py: "3.12" }
          - { os: ubuntu-latest, py: "3.13" }
          - { os: ubuntu-latest, py: "3.14" }
          - { os: windows-latest, py: "3.12" }
          - { os: macOS-latest, py: "3.12" }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up Python ${{ matrix.config.py }}
        run: uv python install ${{ matrix.config.py }}

      - name: Install package
        run: uv sync

      - name: Test with pytest
        run: uv run pytest tests/

      - name: Check code style
        run: |
          uv run ruff format src tests --check
          uv run ruff check src tests

  # The jobs above all install from uv.lock, i.e. the newest resolution. That
  # never exercises the version floors declared in pyproject.toml, so a floor
  # can drift into being wrong without anything failing. This job resolves each
  # direct dependency down to its declared minimum (transitive deps still float
  # up) and runs the suite there, which is the only thing that makes those
  # floors a tested claim rather than an assumption.
  floors:
    runs-on: ubuntu-latest
    name: dependency floors (lowest-direct)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up Python
        run: uv python install 3.12

      - name: Install at the declared minimums
        run: uv sync --resolution lowest-direct

      - name: Test with pytest
        run: uv run pytest tests/
