# this workflow checks that the docs tree still builds and that its
# admonitions are intact, since the developmentfinance.org docs build reads
# docs/mkdocs.yml as the nav for these pages and raises on a nav entry it
# cannot resolve

name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      - "pyproject.toml"
  # "Build documentation" is a required status check on main, and GitHub never
  # reports a required check that a paths filter excluded, so any pull request
  # touching nothing under docs/ would sit on "Expected" and stay unmergeable.
  # This trigger therefore runs on every pull request, which costs about 20
  # seconds each.
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    # Matches the required status check configured on main. GitHub matches
    # these by name, and a mismatch looks exactly like a check that has yet to
    # report.
    name: Build documentation

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install docs dependencies
        run: uv sync --group docs

      - name: Build the site
        # --strict turns warnings into errors, so a broken relative link or a
        # nav entry pointing at a missing file fails here, before the
        # developmentfinance.org docs build sees it
        run: uv run mkdocs build --strict --site-dir "$RUNNER_TEMP/site"
        working-directory: docs

      - name: Check admonition indentation
        # An admonition body must be indented 4 spaces, which is what the
        # developmentfinance.org build expects when it converts `!!!`
        # admonitions to GitHub alerts. Dedented bodies are valid Markdown, so
        # --strict passes them, but the converter folds only the first
        # paragraph of a dedented body into the alert and leaves later
        # paragraphs as loose text. mdformat dedents these bodies, which is why
        # docs/ is excluded from that hook.
        run: |
          python3 - <<'PY'
          import glob
          import re
          import sys

          broken = []
          for path in sorted(glob.glob("docs/docs/*.md")):
              lines = open(path, encoding="utf-8").read().split("\n")
              for i, line in enumerate(lines):
                  if not re.match(r"^!!!\s+\w+", line):
                      continue
                  body = i + 1
                  while body < len(lines) and lines[body].strip() == "":
                      body += 1
                  if body >= len(lines) or not lines[body].startswith("    "):
                      broken.append(f"{path}:{i + 1}: {line.strip()}")

          if broken:
              print("Admonition bodies must be indented 4 spaces:\n")
              print("\n".join(broken))
              sys.exit(1)

          print("All admonition bodies are correctly indented.")
          PY
