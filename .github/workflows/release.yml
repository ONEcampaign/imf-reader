# this workflow will upload the package to pypi when a new release is created
name: release

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  release:
    name: Release package to PyPI
    runs-on: ubuntu-latest
    # Matches the environment named in the PyPI trusted publisher for this
    # project. The names must agree or PyPI rejects the OIDC claim.
    environment: pypi
    permissions:
      # Declaring any permission drops the rest to none, so checkout needs
      # contents spelled out alongside the OIDC token the publish step mints.
      contents: read
      id-token: write

    steps:
      - name: Check-out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Set up Python
        run: uv python install 3.12

      - name: Install package
        run: uv sync

      - name: Build wheels and source tarball
        run: uv build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
          verify-metadata: true
          verbose: true
