# this workflow will upload the package to pypi when a new release is created
name: release

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  release:
    name: Release package to PyPI
    runs-on: ubuntu-latest
    # Matches the environment named in the PyPI trusted publisher for this
    # project. The names must agree or PyPI rejects the OIDC claim.
    environment: pypi
    permissions:
      # Declaring any permission drops the rest to none, so checkout needs
      # contents spelled out alongside the OIDC token the publish step mints.
      contents: read
      id-token: write

    steps:
      - name: Check-out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Set up Python
        run: uv python install 3.12

      - name: Install package
        run: uv sync

      - name: Build wheels and source tarball
        run: uv build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
          verify-metadata: true
          verbose: true
